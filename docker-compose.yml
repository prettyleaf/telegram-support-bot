name: support-ticket-bot

services:
  support-ticket-bot:
    build:
      context: .
      dockerfile: Dockerfile
#    image: support-ticket-bot:${BOT_VERSION:?set BOT_VERSION in .env to the loaded image tag}
    container_name: support-ticket-bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      support-ticket-postgres:
        condition: service_healthy
#    expose:
#      - "8080"
    ports:
      - "8080:8080"
    networks:
      - support-ticket-bot

  support-ticket-postgres:
    image: postgres:18-alpine
    container_name: support-ticket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - support-ticket-bot

  support-ticket-valkey:
    image: valkey/valkey:8-alpine
    container_name: support-ticket-valkey
    restart: unless-stopped
    profiles:
      - web-admin
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
    networks:
      - support-ticket-bot

volumes:
  postgres_data:

networks:
  support-ticket-bot:
    driver: bridge
