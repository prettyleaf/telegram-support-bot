# Support Ticket Bot Configuration
# =================================

# Bot settings
bot:
  # Log level: debug, info, warn, error
  log_level: info

# Ticket settings
tickets:
  # Auto-close inactive tickets after X hours (0 = disabled)
  auto_close_hours: 0
  
  # Maximum open tickets per user
  max_open_per_user: 3
  
  # Ticket number prefix
  number_prefix: ""
  
  # Enable ticket priority
  priority_enabled: true
  
  # Default priority: low, normal, high, urgent
  default_priority: normal

# Onboarding captcha shown before the user can use the bot
captcha:
  # Enable captcha on first launch and before other private actions
  enabled: true

  # Types: math, button, text, custom
  type: math

  # How long the current captcha stays valid
  timeout_seconds: 120

  # Used when type=custom
  questions:
    - question: "Сколько будет 2 + 2? / How much is 2 + 2?"
      correct_answer: "4"
      options:
        - "3"
        - "4"
        - "5"
        - "6"
    - question: "Нажмите на слово Support / Tap the word Support"
      correct_answer: "Support"
      options:
        - "Ticket"
        - "Support"
        - "Panel"
        - "Hello"

# HWID support flow
hwid:
  # Enable the automatic HWID/device-management prompt for matching ticket messages
  enabled: true

  # Users can remove panel devices once per X hours (0 = no cooldown)
  delete_cooldown_hours: 24

  # Add extra phrases here to widen the trigger filter
  trigger_keywords:
    - "hwid"
    - "хвид"
    - "удалить устройство"
    - "удаление устройства"
    - "лимит устройств"
    - "лимит устройства"
    - "delete device"
    - "remove device"
    - "device limit"

# Message overrides (optional)
messages:
  # Automated support reply sent immediately after a new ticket is opened
  ticket_welcome: |
    👋 <b>Hello!</b>

    Your ticket #{ticket_number} is now open. Our support team will review it shortly.

    You can send any extra details in this chat at any time.

  # Optional Russian override for the automated support reply
  ticket_welcome_ru: |
    👋 <b>Здравствуйте!</b>

    Ваш тикет #{ticket_number} открыт. Наша команда поддержки скоро его посмотрит.

    Вы можете отправить дополнительные детали в этом чате в любое время.

# Database settings
database:
  # Connection pool settings
  max_connections: 10
  min_connections: 2
  max_conn_lifetime_minutes: 60
  max_conn_idle_minutes: 30
  health_check_period_seconds: 30

# Rate limiting
rate_limit:
  # Maximum messages per minute from user
  max_messages_per_minute: 10
  
  # Cooldown between ticket creations (seconds)
  ticket_creation_cooldown: 60

# Thread settings for support chat
thread:
  # Topic name format for new tickets
  name_format: "#{ticket_number} - {user_name}"
  
  # Topic icon color (0-6)
  icon_color: 0
