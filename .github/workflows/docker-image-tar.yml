name: Build Docker Image Tar

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for the Docker image tag and tarball name, for example 1.2.3
        required: true
        type: string
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-image-tar:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: support-ticket-bot

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve build metadata
        id: meta
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          VERSION="$(printf '%s' "${VERSION}" | tr -d '[:space:]')"
          if [ -z "${VERSION}" ]; then
            echo "Version must not be empty" >&2
            exit 1
          fi
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must match 1.2.3 format without a leading v" >&2
            exit 1
          fi

          ARTIFACT_NAME="${IMAGE_NAME}-${VERSION}.tar"
          IMAGE_REF="${IMAGE_NAME}:${VERSION}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=${ARTIFACT_NAME}" >> "${GITHUB_OUTPUT}"
          echo "image_ref=${IMAGE_REF}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build Docker image
        run: docker build --tag "${{ steps.meta.outputs.image_ref }}" .

      - name: Export Docker image tarball
        run: docker save --output "${{ steps.meta.outputs.artifact_name }}" "${{ steps.meta.outputs.image_ref }}"

      - name: Generate checksum
        run: sha256sum "${{ steps.meta.outputs.artifact_name }}" > "${{ steps.meta.outputs.artifact_name }}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.meta.outputs.artifact_name }}
            ${{ steps.meta.outputs.artifact_name }}.sha256
          if-no-files-found: error

      - name: Create GitHub release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.meta.outputs.artifact_name }}
            ${{ steps.meta.outputs.artifact_name }}.sha256
